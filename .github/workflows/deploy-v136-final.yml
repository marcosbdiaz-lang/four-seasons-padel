name: Deploy V136 Palmares final
on:
  push:
    paths:
      - 'deploy_v136/FINAL_READY'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Palmares page
        run: cat deploy_v136/pal_1.txt deploy_v136/pal_2.txt deploy_v136/pal_3.txt deploy_v136/pal_4.txt > palmares.html
      - name: Patch index V136
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='''<section id="playerAreaView" hidden>
                <div class="sectionTitle">ÁREA DEL JUGADOR</div>
                <div class="newShell">
                  <p class="newIntro">Tu espacio personal dentro de Four Seasons Pádel.</p>
                  <div class="newGrid">
                    <article class="newCard wide">
                      <h3>🏆 PALMARÉS</h3>
                      <p>Busca un jugador y consulta su historia en la liga: posiciones anuales, mejores jornadas, Top 10, Top 8 trimestrales y próximos históricos de fases finales.</p>
                      <div style="margin-top:16px"><button type="button" class="newPlayerBtn" id="openPalmaresSearch" aria-expanded="false">BUSCAR JUGADOR</button></div>
                      <div id="palmaresSearchBox" hidden style="margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)">
                        <input id="palmaresPlayerSearch" list="palmaresPlayersList" class="playerSearch" type="search" placeholder="🔎 Escribe nombre o selecciona un jugador…" autocomplete="off">
                        <datalist id="palmaresPlayersList"></datalist>
                        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button type="button" class="newPlayerBtn" id="palmaresPlayerGo">VER PALMARÉS</button></div>
                        <div id="palmaresSearchStatus" style="margin-top:8px;font-size:12px;opacity:.75"></div>
                      </div>
                    </article>
                    <article class="newCard wide">
                      <h3>💰 MONEDERO</h3>
                      <p>Consulta el saldo actual de Tesorería y, mediante tu ID + PIN, revisa tu histórico completo de movimientos.</p>
                      <div style="margin-top:16px"><a class="newPlayerBtn" href="tesoreria.html" style="display:inline-block;text-decoration:none">ABRIR MONEDERO</a></div>
                    </article>
                  </div>
                </div>
              </section>'''
          s,n=re.subn(r'<section id="playerAreaView" hidden>.*?</section>',new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se encontró playerAreaView una vez')
          needle='const playerAreaView=document.getElementById("playerAreaView");'
          refs=needle+'''\nconst openPalmaresSearch=document.getElementById("openPalmaresSearch");
          const palmaresSearchBox=document.getElementById("palmaresSearchBox");
          const palmaresPlayerSearch=document.getElementById("palmaresPlayerSearch");
          const palmaresPlayersList=document.getElementById("palmaresPlayersList");
          const palmaresPlayerGo=document.getElementById("palmaresPlayerGo");
          const palmaresSearchStatus=document.getElementById("palmaresSearchStatus");
          let palmaresPlayersV136=[];
          let palmaresPlayersLoadedV136=false;'''
          if needle not in s: raise SystemExit('refs no encontradas')
          s=s.replace(needle,refs,1)
          needle2='async function setView(view){'
          js=r'''
          function normalizePalmaresV136(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();}
          async function ensurePalmaresPlayersV136(){
            if(palmaresPlayersLoadedV136)return;
            if(palmaresSearchStatus)palmaresSearchStatus.textContent="Cargando jugadores…";
            try{
              const [canonResp,ranking]=await Promise.all([
                fetchWithTimeout(`${SUPABASE_REST_URL}/jugadores_canonicos?select=player_key,nombre&order=nombre.asc`,{headers:supabaseHistoryHeaders(),cache:"no-store"},3000),
                fetchRankingFromSupabaseV83().catch(()=>({clasificacion:[]}))
              ]);
              if(!canonResp.ok)throw new Error(`Supabase ${canonResp.status}`);
              const canon=await canonResp.json();
              const aliases=new Map((ranking&&Array.isArray(ranking.clasificacion)?ranking.clasificacion:[]).filter(x=>x&&x.nombre).map(x=>[normalizePalmaresV136(x.nombre),String(x.jugador||"").trim()]));
              palmaresPlayersV136=(Array.isArray(canon)?canon:[]).filter(x=>x&&x.player_key&&x.nombre).map(x=>({key:String(x.player_key),nombre:String(x.nombre),alias:aliases.get(normalizePalmaresV136(x.nombre))||""}));
              if(palmaresPlayersList)palmaresPlayersList.innerHTML=palmaresPlayersV136.map(x=>{const label=x.alias?`${x.nombre} · ${x.alias}`:x.nombre;return `<option value="${esc(x.nombre)}" label="${esc(label)}"></option>`;}).join("");
              palmaresPlayersLoadedV136=true;
              if(palmaresSearchStatus)palmaresSearchStatus.textContent=`${palmaresPlayersV136.length} jugadores disponibles · sin PIN`;
            }catch(e){if(palmaresSearchStatus)palmaresSearchStatus.textContent="❌ No se pudo cargar el buscador de jugadores";}
          }
          function openSelectedPalmaresV136(){
            if(!palmaresPlayerSearch)return;
            const typed=String(palmaresPlayerSearch.value||"").trim(),n=normalizePalmaresV136(typed);
            const found=palmaresPlayersV136.find(x=>normalizePalmaresV136(x.nombre)===n||(x.alias&&normalizePalmaresV136(x.alias)===n)||normalizePalmaresV136(`${x.nombre} ${x.alias}`)===n);
            if(!found){if(palmaresSearchStatus)palmaresSearchStatus.textContent="Selecciona un jugador de la lista.";return;}
            location.href=`palmares.html?key=${encodeURIComponent(found.key)}&name=${encodeURIComponent(found.nombre)}`;
          }
          if(openPalmaresSearch)openPalmaresSearch.addEventListener("click",async()=>{const willOpen=palmaresSearchBox?palmaresSearchBox.hidden:true;if(palmaresSearchBox)palmaresSearchBox.hidden=!willOpen;openPalmaresSearch.setAttribute("aria-expanded",String(willOpen));if(willOpen){await ensurePalmaresPlayersV136();if(palmaresPlayerSearch)palmaresPlayerSearch.focus();}});
          if(palmaresPlayerGo)palmaresPlayerGo.addEventListener("click",openSelectedPalmaresV136);
          if(palmaresPlayerSearch)palmaresPlayerSearch.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();openSelectedPalmaresV136();}});
          '''
          if needle2 not in s: raise SystemExit('setView no encontrado')
          s=s.replace(needle2,js+needle2,1)
          if '· <strong>V135</strong></footer>' not in s: raise SystemExit('Pie V135 no encontrado')
          s=s.replace('· <strong>V135</strong></footer>','· <strong>V136</strong></footer>',1)
          s=s.replace('ctx.fillText("Marcos Good V135",width-40,height-22);','ctx.fillText("Marcos Good V136",width-40,height-22);',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate V136
        shell: python
        run: |
          from pathlib import Path
          i=Path('index.html').read_text(encoding='utf-8')
          p=Path('palmares.html').read_text(encoding='utf-8')
          assert 'id="openPalmaresSearch"' in i
          assert 'palmares.html?key=' in i
          assert '&k=' not in i[i.find('function openSelectedPalmaresV136'):i.find('function openSelectedPalmaresV136')+1800]
          assert '· <strong>V136</strong></footer>' in i
          assert 'PALMARÉS' in p and 'WEB V136' in p and 'palmares_config.js' in p
          assert 'logo_palmares.jpg' in p
      - name: Commit V136
        run: |
          git config user.name 'four-seasons-padel-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html palmares.html
          git commit -m 'Publica V136: Palmarés sin PIN con buscador' || exit 0
          git push
