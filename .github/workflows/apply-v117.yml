name: Apply Four Seasons V117

on:
  push:
    paths:
      - '.github/workflows/apply-v117.yml'
      - '.github/v117.patch'

permissions:
  contents: write

jobs:
  apply-v117:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V116 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "593fffb0726898d155bccf8d863a1a4b40ca4936"
          grep -q '<strong>V116</strong></footer>' index.html

      - name: Apply audited V117 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/v117.patch
          git apply .github/v117.patch
          test "$(git hash-object index.html)" = "5575e80ac5b97d4e28db7453e9389f8b001ca1ce"

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          assert blocks, 'No script blocks found'
          Path('/tmp/index117.js').write_text(blocks[-1],encoding='utf-8')
          assert '<strong>V117</strong></footer>' in s
          assert '🏆 TOP 30 PAREJAS' in s
          assert 'REGISTROS DEL AÑO III A HOY' in s
          PY
          node --check /tmp/index117.js

      - name: Commit V117
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V117: Año III en parejas + TOP 30'
          git push origin HEAD:main
