name: Apply Four Seasons V117

on:
  push:
    paths:
      - '.github/workflows/apply-v117.yml'

permissions:
  contents: write

jobs:
  apply-v117:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
