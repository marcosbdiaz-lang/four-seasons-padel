name: Apply V119 conflict colors
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v119-conflicts.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and validate V119/V122
        run: python .github/apply_v119.py
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V122: isolated desktop clone for mobile exports'
          git push origin main
# V122 trigger
